name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: asvnth
          outputs: |
            dist/github-snake.svg?color_snake=%23ff1744&color_dots=%23161b22,%23300a12,%23520f1b,%238f182c,%23ff1744
            dist/github-snake-dark.svg?color_snake=%23ff1744&color_dots=%23161b22,%23300a12,%23520f1b,%238f182c,%23ff1744

      - name: Push snake
        uses: crazy-max/ghaction-github-pages@v5
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
